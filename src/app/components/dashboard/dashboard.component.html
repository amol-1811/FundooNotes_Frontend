<!-- FIXED HEADER -->
<mat-toolbar color="primary" class="header-toolbar">
    <!-- LEFT -->
    <div class="left-section">
        <button mat-icon-button (click)="toggleSidebar()" matTooltip="Main Menu">
            <mat-icon>menu</mat-icon>
        </button>
        <img src="assets/keep.png" alt="Logo" class="logo" />
        <span class="keep-title">Keep</span>
    </div>

    <!-- CENTER (Search) -->
    <div class="search-section">
        <mat-icon>search</mat-icon>
        <input matInput placeholder="Search notes" [(ngModel)]="searchText" (input)="onSearchChange()" />
        <mat-icon class="clear-icon" *ngIf="searchText" (click)="clearSearch()" matTooltip="Clear">close</mat-icon>
    </div>

    <!-- RIGHT -->
    <div class="right-section">
        <div class="icon-group">
            <mat-icon class="icon" matTooltip="Refresh">refresh</mat-icon>
            <mat-icon class="icon" matTooltip="List view">view_agenda</mat-icon>
            <mat-icon class="icon" matTooltip="Settings">settings</mat-icon>
        </div>
        <span class="spacer"></span>
        <mat-icon class="icon" matTooltip="Google apps">apps</mat-icon>
        <button mat-icon-button [matTooltip]="
        'Google Account\n' +
        userFirstName + ' ' + userLastName + '\n' +
        userEmail
      " matTooltipClass="account-tooltip" matTooltipPosition="below">
            <mat-icon>account_circle</mat-icon>
        </button>
    </div>
</mat-toolbar>

<!-- MAIN BODY -->
<div class="main-container">
    <!-- SIDENAV -->
    <div class="sidenav" [class.collapsed]="!isSidebarOpen">
        <mat-nav-list>
            <a mat-list-item class="nav-link tooltip-hover" *ngFor="let nav of navItems"
                [attr.data-tooltip]="!isSidebarOpen ? nav.label : null">
                <mat-icon matListIcon>{{ nav.icon }}</mat-icon>
                <span class="nav-label" *ngIf="isSidebarOpen">{{ nav.label }}</span>
            </a>
        </mat-nav-list>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <p>Welcome to your dashboard!</p>
    </div>
</div>
