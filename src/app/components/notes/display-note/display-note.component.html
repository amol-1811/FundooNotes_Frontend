<!-- display-note.component.html -->
<div class="notes-container">
    <div *ngIf="notes.length === 0" class="empty-notes">
        <div class="light-bulb-icon">
            <span class="material-icons-outlined">lightbulb</span>
        </div>
        <p>Notes that you add appear here</p>
    </div>

    <div class="notes-grid">
        <div *ngFor="let note of notes" class="note-card" 
             [style.backgroundColor]="note.color" 
             [class.selected]="selectedNotes.has(note)"
             (click)="openNoteDetail(note)">
            <!-- Selection checkbox -->
            <div class="selection-checkbox" (click)="selectNote(note, $event)">
                <span class="material-icons-outlined">{{ selectedNotes.has(note) ? 'check_circle' : 'circle' }}</span>
            </div>
            
            <div class="note-header">
                <div class="note-title">{{ note.title }}</div>
                <button mat-icon-button class="pin-icon" (click)="togglePin(note, $event)">
                    <span class="material-icons-outlined">{{ note.isPinned ? 'push_pin' : 'push_pin' }}</span>
                </button>
            </div>
            <div class="note-body">{{ note.content }}</div>
            <div class="note-actions">
                <button mat-icon-button matTooltip="Background options" (click)="toggleColorPalette(note, $event)">
                    <span class="material-icons-outlined">palette</span>
                </button>
                <button mat-icon-button matTooltip="Remind me" (click)="$event.stopPropagation()">
                    <span class="material-icons-outlined">notifications</span>
                </button>
                <button mat-icon-button matTooltip="Collaborator" (click)="$event.stopPropagation()">
                    <span class="material-icons-outlined">person_add</span>
                </button>
                <button mat-icon-button matTooltip="Add image" (click)="$event.stopPropagation()">
                    <span class="material-icons-outlined">image</span>
                </button>
                <button mat-icon-button matTooltip="Archive" (click)="$event.stopPropagation()">
                    <span class="material-icons-outlined">archive</span>
                </button>
                <button mat-icon-button matTooltip="More" (click)="$event.stopPropagation()">
                    <span class="material-icons-outlined">more_vert</span>
                </button>
            </div>

            <!-- Color palette for each note -->
            <div *ngIf="activeColorPalette === note" class="color-palette" (click)="$event.stopPropagation()">
                <div class="color-options">
                    <div *ngFor="let color of colorOptions" class="color-option" [style.background-color]="color"
                        (click)="changeNoteColor(note, color, $event)" [class.selected]="note.color === color">
                        <span class="material-icons-outlined check-icon" *ngIf="note.color === color">check</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
