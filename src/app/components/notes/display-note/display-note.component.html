<!-- display-note.component.html -->
<div class="notes-container">
    <div *ngIf="notes.length === 0" class="empty-notes">
        <div class="light-bulb-icon">
            <span class="material-icons-outlined">lightbulb</span>
        </div>
        <p>Notes that you add appear here</p>
    </div>

    <div [class]="isGridView ? 'notes-grid' : 'notes-list' ">
        <div *ngFor="let note of notes" class="note-card" [style.backgroundColor]="note.color"
            [class.selected]="selectedNotes.has(note)" (click)="openNoteDetail(note)">
            <!-- <div *ngIf="!note.isArchive || false" class="note-card" [style.backgroundColor]="note.color"
            [class.selected]="selectedNotes.has(note)" (click)="openNoteDetail(note)"> -->
            <!-- Selection checkbox -->
            <div class="selection-checkbox" (click)="selectNote(note, $event)">
                <span class="material-icons-outlined">{{ selectedNotes.has(note) ? 'check_circle' : 'circle' }}</span>
            </div>

            <div class="note-header">
                <div class="note-title">{{ note.title }}</div>
                <button mat-icon-button class="pin-icon" (click)="togglePin(note, $event)">
                    <span class="material-icons-outlined">{{ note.isPinned ? 'push_pin' : 'push_pin' }}</span>
                </button>
            </div>
            <div class="note-body">{{ note.description }}</div>

            <div *ngIf="note.reminder !== null">
                <mat-chip>
                    {{note.reminder | date:'medium' }}
                    <mat-icon style="height: 20px; cursor: pointer;" (click)="removeReminder(note)">close</mat-icon>
                </mat-chip>
            </div>
            <div class="note-actions">
                <button *ngIf="!note.isTrash" mat-icon-button matTooltip="Background options"
                    (click)="toggleColorPalette(note, $event)">
                    <span class="material-icons-outlined">palette</span>
                </button>
                <button *ngIf="!note.isTrash" mat-icon-button [matMenuTriggerFor]="menu" matTooltip="Remind me">
                    <span class="material-icons-outlined">notifications</span>
                </button>
                <mat-menu #menu="matMenu" class="mat-menu" style="width: 400px;" (click)="addReminder(note, $event)">
                    <p style="padding-left: 5px; padding-right: 5px;">Remind me later</p>
                    <p style="padding-left: 5px; padding-right: 5px; color: #666;">Saved in Google Reminders</p>
                    <button mat-menu-item class="menu-item" (click)="changeReminder(note, dateObj.date, 'Today')">
                        <span>Later Today</span>
                        <span style="margin-left: 40px;">
                            {{dateObj.today}}
                        </span>
                    </button>
                    <button mat-menu-item class="menu-item"
                        (click)="changeReminder(note, dateObj.tomorrowDate, 'Tomorrow')">
                        <span>Tomorrow</span>
                        <span style="margin-left: 50px;">
                            {{dateObj.tomorrow}}
                        </span>
                    </button>
                    <button mat-menu-item class="menu-item"
                        (click)="changeReminder(note, dateObj.nextWeek.date, 'Next Week')">
                        <span>Next Week</span>
                        <span style="margin-left: 40px;">{{dateObj.nextWeek.day}} {{dateObj.nextWeek.time}}</span>
                    </button>
                    <mat-form-field class="full-width" style="margin-left: 5px; margin-right: 5px; ">
                        <mat-label>Select Reminder Date</mat-label>
                        <input matInput [matDatepicker]="picker" (dateChange)="dateChangeEvent(note, $event)">
                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </mat-menu>

                <button *ngIf="!note.isTrash" mat-icon-button matTooltip="Collaborator"
                    (click)="openCollaboratorModal(note, $event)">
                    <span class="material-icons-outlined">person_add</span>
                </button>
                <button *ngIf="!note.isTrash" mat-icon-button matTooltip="Add image" (click)="$event.stopPropagation()">
                    <span class="material-icons-outlined">image</span>
                </button>
                <button *ngIf="!note.isArchive && !note.isTrash" mat-icon-button matTooltip="Archive"
                    (click)="archiveNote(note, $event)">
                    <span class="material-icons-outlined">archive</span>
                </button>
                <button *ngIf="!note.isTrash && note.isArchive" mat-icon-button matTooltip="unarchive"
                    (click)="archiveNote(note, $event)">
                    <span class="material-icons-outlined">unarchive</span>
                </button>
                <!-- <button *ngIf="!note.isTrash && !note.isArchive" mat-icon-button matTooltip="trash"
                    (click)="trashNote(note, $event)">
                    <span class="material-icons-outlined">delete</span>
                </button> -->
                <button *ngIf="note.isTrash" mat-icon-button matTooltip="delete Forever"
                    (click)="deleteNote(note, $event)">
                    <span class="material-icons-outlined">delete_forever</span>
                </button>
                <button *ngIf="note.isTrash" mat-icon-button matTooltip="restore" (click)="trashNote(note, $event)">
                    <span class="material-icons-outlined">restore</span>
                </button>
                <button *ngIf="!note.isTrash" mat-icon-button matTooltip="More" [matMenuTriggerFor]="moreMenu"
                    (click)="$event.stopPropagation()">
                    <span class="material-icons-outlined">more_vert</span>
                </button>
                <mat-menu #moreMenu="matMenu">
                    <button mat-menu-item (click)="openAssignLabelModal()">
                        <span>Assign Label</span>
                    </button>
                    <button mat-menu-item (click)="trashNote(note, $event)">
                        <span>Delete</span>
                    </button>
                </mat-menu>
            </div>

            <!-- Color palette for each note -->
            <div *ngIf="activeColorPalette === note" class="color-palette">
                <div class="color-options">
                    <div *ngFor="let color of colorOptions" class="color-option" [style.background-color]="color"
                        (click)="changeNoteColor(note, color, $event)" [class.selected]="note.color === color">
                        <span class="material-icons-outlined check-icon" *ngIf="note.color === color">check</span>
                    </div>
                </div>
            </div>
            <!-- </div> -->
        </div>
    </div>
</div>

<app-modal [isVisible]="showAssignLabelModal" (close)="showAssignLabelModal = false">
    <div>
        <h6>Label note</h6>
        <div *ngIf="allLabels !== undefined && allLabels.length > 0">
            <span *ngFor="let label of allLabels">
                <mat-checkbox (update)="assignLabelToNote(selectNote, label, $event)">{{label?.labelName}}</mat-checkbox>
            </span>
        </div>
    </div>
</app-modal>

<app-modal [isVisible]="showCollaboratorModal" (close)="showCollaboratorModal = false">
    <app-collaborator [noteId]="activeCollaboratorNote?.notesId"></app-collaborator>
</app-modal>
