<div>
    <div>
        <app-create-note></app-create-note>
    </div>
    
    <div class="reminder-container">
        
        <div class="notes-container">
            <div *ngIf="reminderNotes.length === 0" class="empty-notes">
                <div class="light-bulb-icon">
                    <span class="material-icons-outlined">lightbulb</span>
                </div>
                <p>Reminder notes that you add appear here</p>
            </div>

            <div *ngFor="let note of reminderNotes" class="note-card" [style.backgroundColor]="note.color"
                [class.selected]="selectedNotes.has(note)" (click)="openNoteDetail(note)">
                <!-- <div *ngIf="!note.isArchive || false" class="note-card" [style.backgroundColor]="note.color"
                    [class.selected]="selectedNotes.has(note)" (click)="openNoteDetail(note)"> -->
                <!-- Selection checkbox -->
                <div class="selection-checkbox" (click)="selectNote(note, $event)">
                    <span class="material-icons-outlined">{{ selectedNotes.has(note) ? 'check_circle' : 'circle'
                        }}</span>
                </div>

                <div class="note-header">
                    <div class="note-title">{{ note.title }}</div>
                    <button mat-icon-button class="pin-icon" (click)="togglePin(note, $event)">
                        <span class="material-icons-outlined">{{ note.isPinned ? 'push_pin' : 'push_pin' }}</span>
                    </button>
                </div>
                <div class="note-body">{{ note.description }}</div>
                <div *ngIf="note.reminder !== null">
                    <mat-chip>
                        {{note.reminder | date:'medium' }} 
                        <mat-icon style="height: 20px; cursor: pointer;" (click)="removeReminder(note, $event)">close</mat-icon>
                    </mat-chip>
                </div>
                <div class="note-actions">
                    <button *ngIf="!note.isTrash" mat-icon-button matTooltip="Background options"
                        (click)="toggleColorPalette(note, $event)">
                        <span class="material-icons-outlined">palette</span>
                    </button>
                    <button *ngIf="!note.isTrash" mat-icon-button matTooltip="Done" (click)="markAsDone(note, $event)">
                        <span class="material-icons-outlined">done</span>
                    </button>
                    <button *ngIf="!note.isTrash" mat-icon-button matTooltip="Collaborator"
                        (click)="$event.stopPropagation()">
                        <span class="material-icons-outlined">person_add</span>
                    </button>
                    <button *ngIf="!note.isTrash" mat-icon-button matTooltip="Add image"
                        (click)="$event.stopPropagation()">
                        <span class="material-icons-outlined">image</span>
                    </button>
                    <button *ngIf="!note.isArchive && !note.isTrash" mat-icon-button matTooltip="Archive"
                        (click)="archiveNote(note, $event)">
                        <span class="material-icons-outlined">archive</span>
                    </button>
                    <button *ngIf="!note.isTrash && note.isArchive" mat-icon-button matTooltip="unarchive"
                        (click)="archiveNote(note, $event)">
                        <span class="material-icons-outlined">unarchive</span>
                    </button>
                    <button *ngIf="!note.isTrash && !note.isArchive" mat-icon-button matTooltip="trash"
                        (click)="trashNote(note, $event)">
                        <span class="material-icons-outlined">delete</span>
                    </button>
                    <button *ngIf="note.isTrash" mat-icon-button matTooltip="delete Forever"
                        (click)="trashNote(note, $event)">
                        <span class="material-icons-outlined">delete_forever</span>
                    </button>
                    <button *ngIf="note.isTrash" mat-icon-button matTooltip="restore" (click)="trashNote(note, $event)">
                        <span class="material-icons-outlined">restore</span>
                    </button>
                    <button *ngIf="!note.isTrash" mat-icon-button matTooltip="More" (click)="$event.stopPropagation()">
                        <span class="material-icons-outlined">more_vert</span>
                    </button>
                </div>

                <!-- Color palette for each note -->
                <div *ngIf="activeColorPalette === note" class="color-palette">
                    <div class="color-options">
                        <div *ngFor="let color of colorOptions" class="color-option" [style.background-color]="color"
                            (click)="changeNoteColor(note, color, $event)" [class.selected]="note.color === color">
                            <span class="material-icons-outlined check-icon" *ngIf="note.color === color">check</span>
                        </div>
                    </div>
                </div>
                <!-- </div> -->
            </div>
        </div>
    </div>

</div>
